<!--
  Fixed plan template for implement-issue step 4 (Large changes) / ship-issue.
  Fill the {{...}} slots only; sections marked "optional" may be deleted whole
  when they do not apply. Never otherwise change the structure, and never touch
  the CSS — it must stay identical to report-template.html (one design family;
  edit the two files together).
  Reader model: someone who knows this codebase but not this plan, reading to
  catch a wrong turn rather than to approve it — the chain no longer waits for
  sign-off. Show the shape of the change first, then the least prose that makes
  the picture make sense. They know the stack, so never explain its vocabulary;
  they have not seen the names this change will touch, so every type, class,
  module, or product concept this repository owns gets a few words saying what
  it is the first time it appears.
-->
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #fbfbfc;
    --surface: #ffffff;
    --ink: #1f2328;
    --ink-2: #57606c;
    --line: #e3e6ea;
    --accent: #3574f0;
    --accent-soft: #eaf1fe;
    --warn: #b35c00;
    --warn-soft: #fdf3e5;
    --ok: #1a7f37;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c; --surface: #1e2126; --ink: #dfe1e5; --ink-2: #9da4ad;
      --line: #32363c; --accent: #6a9bfa; --accent-soft: #22304a;
      --warn: #e8a13c; --warn-soft: #37301f; --ok: #57ab5a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191c; --surface: #1e2126; --ink: #dfe1e5; --ink-2: #9da4ad;
    --line: #32363c; --accent: #6a9bfa; --accent-soft: #22304a;
    --warn: #e8a13c; --warn-soft: #37301f; --ok: #57ab5a;
  }
  :root[data-theme="light"] {
    --bg: #fbfbfc; --surface: #ffffff; --ink: #1f2328; --ink-2: #57606c;
    --line: #e3e6ea; --accent: #3574f0; --accent-soft: #eaf1fe;
    --warn: #b35c00; --warn-soft: #fdf3e5; --ok: #1a7f37;
  }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.75; margin: 0; padding: 2.5rem 1.25rem 5rem;
  }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.55rem; line-height: 1.35; text-wrap: balance; margin: 0 0 .4rem; }
  h2 {
    font-size: 1.05rem; margin: 2.6rem 0 .9rem; padding-bottom: .4rem;
    border-bottom: 1px solid var(--line);
  }
  h3 { font-size: .95rem; margin: 1.4rem 0 .5rem; }
  p { margin: .6rem 0; }
  .eyebrow {
    font-size: .72rem; letter-spacing: .09em; text-transform: uppercase;
    color: var(--accent); font-weight: 600;
  }
  .lede { color: var(--ink-2); margin-top: .2rem; }
  .meta { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.1rem 0 0; }
  .chip {
    font-size: .78rem; padding: .15rem .6rem; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 1rem 1.2rem; margin: .9rem 0;
  }
  .card h3 { margin-top: 0; }
  .card .files { font-family: var(--mono); font-size: .78rem; color: var(--ink-2); margin-top: .6rem; }
  code {
    font-family: var(--mono); font-size: .84em;
    background: var(--accent-soft); border-radius: 4px; padding: .08em .35em;
  }
  ul { padding-left: 1.3rem; margin: .5rem 0; }
  li { margin: .3rem 0; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { text-align: left; padding: .45rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
  td.id { font-family: var(--mono); white-space: nowrap; }
  .in { color: var(--ok); font-weight: 600; }
  .ask { color: var(--warn); font-weight: 600; }
  .out { color: var(--ink-2); }
  .note {
    border-left: 3px solid var(--warn); background: var(--warn-soft);
    padding: .6rem .9rem; border-radius: 0 6px 6px 0; margin: 1rem 0; font-size: .92rem;
  }
  pre.mermaid {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 1rem; overflow-x: auto;
  }
  .grid2 {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr));
    gap: .9rem; margin: .9rem 0;
  }
  .grid2 .card { margin: 0; }
  .walk { display: flex; flex-direction: column; gap: 2.4rem; margin: 1.2rem 0; }
  .walk > section { display: flex; flex-direction: column; gap: .6rem; }
  .walk h3 { margin: 0; }
  .walk .no {
    display: block; font-family: var(--mono); font-size: .72rem;
    letter-spacing: .1em; color: var(--accent); font-weight: 600;
  }
  figure { margin: 0; display: flex; flex-direction: column; gap: .7rem; }
  .frame {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 1.2rem 1rem; overflow-x: auto;
  }
  .frame svg { display: block; width: 100%; height: auto; }
  figcaption { font-size: .92rem; color: var(--ink-2); line-height: 1.7; }
</style>
<main>
  <!-- Issue number · branch · change-size classification -->
  <p class="eyebrow">{{EYEBROW}}</p>
  <h1>{{TITLE}}</h1>
  <!-- 1–2 sentences: what this change does and how far it goes -->
  <p class="lede">{{LEDE}}</p>
  <!-- Chips: change kind, estimated diff size, approval points.
       Use <span class="chip">...</span>; class="chip warn" for approval points. -->
  <div class="meta">{{META_CHIPS}}</div>

  <!-- optional: only for multi-candidate / batch issues.
       Table rows: id / content / disposition (実装 <td class="in"> · 判断待ち
       <td class="ask"> · 次回送り <td class="out">). A .note block may follow
       for decision rationale. -->
  <h2>スコープ</h2>
  <div class="tablewrap">{{SCOPE_TABLE}}</div>

  <!-- The plan's spine: what this change does to the system, as a short chain of
       figures. One step per <section> inside <div class="walk">, each an <h3>
       naming the step, a <figure> holding the drawing in <div class="frame">
       with a ONE-SENTENCE <figcaption>. One to three steps — the usual pair is
       今こうなっている / こう変える, which is the shape a reader checks a plan
       against. Deletable whole when the change moves nothing differently than
       before: a rename, a docs edit, a test-only change.
       <pre class="mermaid"> is the default here. The plan is written before the
       code exists, so precision that will not survive contact with the work is
       wasted; reach for inline <svg> only where the point is a mechanism a flow
       chart cannot hold — two candidate approaches side by side with the edge
       each one adds or removes, so the reader can point at what is being chosen
       between. Either way label every edge, and label a node with what the thing
       does rather than only its class name. Paired before/after drawings hold
       the same granularity. The whole-system picture stays in the project's
       architecture document, when one exists. The Artifact runtime renders
       mermaid natively; viewers opening the raw file see the diagram source. -->
  <h2>しくみ</h2>
  <div class="walk">{{WALKTHROUGH}}</div>

  <!-- One .card per work package: <h3> name, <ul> concrete edits,
       <p class="files"> target file paths -->
  <h2>変更内容</h2>
  {{WORK_PACKAGES}}

  <!-- optional: only when delegating. Who implements what (main loop vs subagents) -->
  <h2>実装レーン</h2>
  {{LANES}}

  <!-- Validation commands to run, review lanes, and round policy -->
  <h2>検証とレビュー</h2>
  {{VALIDATION_REVIEW}}

  <!-- Planned commit messages as a list; PR title/base notes as a <p> -->
  <h2>コミット構成(予定)</h2>
  {{COMMITS}}

  <!-- optional: decisions the user must make before or during implementation -->
  <h2>判断点</h2>
  {{DECISIONS}}
</main>
